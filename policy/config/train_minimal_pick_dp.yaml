defaults:
  - train_diffusion_unet_image_workspace
  - override task: minimal_pick_dp
  - _self_
name: train_minimal_pick_dp
policy:
  _target_: policy.policy.minimal_pick_diffusion_policy.MinimalPickDiffusionPolicy
  down_dims: [128, 256, 512]
  num_inference_steps: 10
dataloader: {batch_size: 8, num_workers: 0}
val_dataloader: {batch_size: 8, num_workers: 0}
training:
  resume: false
  checkpoint_every: 1
  val_every: 1
logging: {mode: disabled, project: labsim}
checkpoint:
  save_last_snapshot: false
  topk: {monitor_key: train_loss, mode: min, k: 1, format_str: 'epoch={epoch:03d}-loss={train_loss:.4f}.ckpt'}
