defaults:
  - train_act_image_workspace
  - override task: lab_cuvette_loading_act
  - _self_
name: train_lab_cuvette_loading_act
horizon: 16
policy:
  camera_names: [camera_1_rgb, camera_2_rgb]
dataloader: {batch_size: 8, num_workers: 0}
val_dataloader: {batch_size: 8, num_workers: 0}
training:
  resume: false
  use_ema: false
  checkpoint_every: 1
  val_every: 1
logging: {mode: disabled, project: labsim}
checkpoint:
  save_last_snapshot: false
  topk: {monitor_key: train_loss, mode: min, k: 1, format_str: 'epoch={epoch:03d}-loss={train_loss:.4f}.ckpt'}
