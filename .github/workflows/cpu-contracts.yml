name: CPU contracts

on:
  push:
    branches: ["codex/labsim", "codex/**"]
  pull_request:
    branches: ["codex/labsim"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Fetch the small registry required by asset-query checks
        run: |
          git lfs pull --include="assets/lab_cuvette_loading/Size_v1/registry.json" --exclude=""
          python -c "import json; json.load(open('assets/lab_cuvette_loading/Size_v1/registry.json'))"
      - name: Install CPU check dependencies
        run: python -m pip install -r requirements/ci.txt
      - name: Check the project entry point
        run: |
          bash -n labsim
          python scripts/labsim_cli.py --help
      - name: Run CPU contracts without Isaac or training
        run: |
          python -m pytest -q \
            tests/test_labsim_cli.py \
            tests/test_package_agent_results.py \
            tests/test_lab_cuvette_env_v1_teacher.py \
            tests/test_lab_cuvette_env_v1_scorer.py \
            tests/test_lab_cuvette_size_v1_workflow_contract.py \
            tests/test_lab_cuvette_size_v1_summary.py \
            tests/test_lab_cuvette_size_v1_report.py \
            tests/test_lab_cuvette_size_v1_handoff.py \
            tests/test_cubence_backend.py \
            tests/test_lab_cuvette_project_assets.py \
            tests/test_lab_cuvette_project_environment.py \
            tests/test_lab_cuvette_project_contract.py \
            tests/test_lab_cuvette_project_rpc.py \
            tests/test_lab_cuvette_project_optional_policies.py \
            tests/test_lab_cuvette_project_native_entry.py \
            tests/test_lab_cuvette_public_sample.py \
            tests/test_lab_cuvette_project_asset_selection.py \
            tests/test_lab_cuvette_action_adapters.py \
            tests/test_labsim_project_versions.py \
            tests/test_lab_cuvette_project_v1_1_*.py \
            tests/test_lab_cuvette_release_rpc.py \
            tests/test_labsim_release_cli.py \
            tests/test_lab_cuvette_external_policy_rollout.py \
            tests/test_cubence_project_v1_1_tools.py
  normal-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/ci.txt
            requirements/ci-readers.txt
      - name: Install CPU-only normal-reader dependencies
        run: |
          python -m pip install -r requirements/ci-readers.txt
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Read qualified H5 fixtures through normal ACT/DP datasets
        run: |
          python -m pytest -q \
            tests/test_lab_cuvette_project_v1_1_data.py \
            tests/test_lab_cuvette_project_v1_1_reader_cli.py \
            tests/test_lab_cuvette_project_release_lifecycle.py \
            tests/test_lab_cuvette_project_release_reader.py \
            tests/test_labsim_release_cli.py \
            tests/test_lab_cuvette_public_sample.py
