name: CPU contracts

on:
  push:
    branches: ["codex/labsim", "codex/**"]
  pull_request:
    branches: ["codex/labsim"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install CPU check dependencies
        run: python -m pip install -r requirements/ci.txt
      - name: Check the project entry point
        run: |
          bash -n labsim
          python scripts/labsim_cli.py --help
      - name: Run CPU contracts without Isaac or training
        run: |
          python -m pytest -q \
            tests/test_labsim_cli.py \
            tests/test_lab_cuvette_env_v1_teacher.py \
            tests/test_lab_cuvette_env_v1_scorer.py \
            tests/test_lab_cuvette_size_v1_workflow_contract.py \
            tests/test_lab_cuvette_size_v1_summary.py \
            tests/test_lab_cuvette_size_v1_report.py \
            tests/test_lab_cuvette_size_v1_handoff.py
